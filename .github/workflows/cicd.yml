name: CI/CD DevSecOps - TechSecure

# Dispara automaticamente a cada alteracao no codigo (push) e em pull requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: techsecure-app
  TRIVY_IMAGE: aquasec/trivy:0.55.0

jobs:
  # ---------------------------------------------------------------
  # 1) BUILD + TESTE (aplicacao Python)
  # ---------------------------------------------------------------
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar testes (pytest)
        run: python -m pytest

  # ---------------------------------------------------------------
  # 2) SECURITY SCAN (SAST + dependencias + filesystem)
  # ---------------------------------------------------------------
  security:
    name: Analise de Seguranca
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de seguranca
        run: pip install bandit pip-audit

      - name: Bandit (SAST - codigo Python)
        run: bandit -r app -f txt -o bandit-report.txt || true

      - name: pip-audit (vulnerabilidades em dependencias)
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json || true

      - name: Trivy (scan do filesystem - deps e configs)
        run: |
          docker run --rm -v "$PWD":/src -w /src "$TRIVY_IMAGE" \
            fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 . \
            | tee trivy-fs-report.txt

      - name: Publicar relatorios de seguranca (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.txt
            pip-audit-report.json
            trivy-fs-report.txt

  # ---------------------------------------------------------------
  # 3) BUILD DA IMAGEM + SCAN DA IMAGEM (Trivy)
  # ---------------------------------------------------------------
  docker-build-scan:
    name: Build e Scan da Imagem
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t "$IMAGE_NAME:$GITHUB_SHA" -t "$IMAGE_NAME:latest" .

      - name: Trivy (scan da imagem Docker)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 "$IMAGE_NAME:latest" \
            | tee trivy-image-report.txt

      - name: Publicar relatorio do scan da imagem
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt

  # ---------------------------------------------------------------
  # 4) DEPLOY AUTOMATICO (runner self-hosted no WSL)
  #    Sobe/atualiza o container localmente de forma automatica.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy automatico (container)
    runs-on: [ self-hosted, wsl ]
    needs: docker-build-scan
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Build da imagem no host de deploy
        run: docker build -t "$IMAGE_NAME:latest" .

      - name: Atualizar container
        run: |
          docker rm -f techsecure-app 2>/dev/null || true
          docker run -d --name techsecure-app -p 8080:8080 --restart unless-stopped "$IMAGE_NAME:latest"

      - name: Verificar healthcheck
        run: |
          sleep 5
          curl -fsS http://localhost:8080/health && echo " -> deploy OK"
